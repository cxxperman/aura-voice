name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The system module (APO) and its installer helper
      - name: Configure native
        run: cmake -S native -B native/build -A x64
      - name: Build native
        run: cmake --build native/build --config Release
      - name: Test the voice chain
        run: native/build/Release/dsp_test.exe
      - name: Stage native binaries
        shell: bash
        run: |
          mkdir -p native/bin
          cp native/build/Release/AuraAPO.dll native/build/Release/AuraSetup.exe native/bin/
      - uses: actions/upload-artifact@v4
        with:
          name: aura-native
          path: native/bin/

      # The Windows installer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: aura-installer
          path: dist/Aura-Setup-*.exe
      - name: Show what went into the app
        shell: bash
        run: |
          ls -la dist/win-unpacked/Aura.exe dist/win-unpacked/resources dist/win-unpacked/resources/native
          npx asar list dist/win-unpacked/resources/app.asar | grep -v node_modules
